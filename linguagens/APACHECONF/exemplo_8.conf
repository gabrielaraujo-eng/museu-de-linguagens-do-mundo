# =====================================================================
# Museu de Linguagens do Mundo - pasta APACHECONF
# exemplo_8.conf - cabecalhos HTTP com mod_headers
#
# Header always set, Header append, Header unset e Header edit em
# <FilesMatch>: endurecimento basico e politica de cache.
#
# Teste de sintaxe:  apache2 -t -f <este arquivo>
# Requer Apache HTTP Server 2.4 com os modulos compartilhados
# instalados em /usr/lib/apache2/modules (padrao Debian/Ubuntu).
# =====================================================================

# --- Preambulo: permite validar este arquivo isoladamente -------
ServerRoot "/etc/apache2"
Listen 8088
LoadModule mpm_event_module "/usr/lib/apache2/modules/mod_mpm_event.so"
LoadModule authz_core_module "/usr/lib/apache2/modules/mod_authz_core.so"
LoadModule authz_host_module "/usr/lib/apache2/modules/mod_authz_host.so"
LoadModule dir_module "/usr/lib/apache2/modules/mod_dir.so"
LoadModule mime_module "/usr/lib/apache2/modules/mod_mime.so"
LoadModule headers_module "/usr/lib/apache2/modules/mod_headers.so"
ServerName linguagens.museu.test
ErrorLog "/var/log/apache2/apacheconf-error.log"
# --- Fim do preambulo -------------------------------------------
DocumentRoot "/var/www/museu"

<Directory "/var/www/museu">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Cabecalhos de seguranca aplicados a todas as respostas.
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:"

# Remove cabecalhos que revelam a implementacao.
Header unset X-Powered-By
Header always unset X-AspNet-Version

# Acrescenta diretiva ao cache sem descartar o valor existente.
Header append Cache-Control "public"

# Somente para os documentos HTML: cache curto e revalidacao.
<FilesMatch "\.html?$">
    Header set Cache-Control "max-age=600, must-revalidate"
</FilesMatch>

# Substitui parte do valor de um cabecalho ja emitido.
Header edit Set-Cookie "^(.+)$" "$1; HttpOnly"

ErrorLog "/var/log/apache2/museu-error.log"
